# 화폐. /돈 관리 에서 GUI 로 만들고 고치는 것을 권장합니다. 금액은 전부 정수입니다(소수점 없음).
#
# id(맨 앞 이름)  영문 소문자·숫자·밑줄 — 명령어에 씁니다. 바꾸면 잔고가 따라가지 않습니다
# name   보이는 이름(MiniMessage)
# unit   금액 뒤에 붙는 글자 — 1,000원
# icon   화면 아이콘(재질). icon-item 은 GUI 에서 손에 든 것으로 정한 모양(모델 번호·커스텀아이템 그대로)
# kind   virtual(숫자만) / item(실물 아이템)
# mode   item 일 때 — inventory(가방에 든 개수가 곧 잔고) / bank(잔고는 숫자, 아이템으로 입금·출금)
# item   item 일 때의 아이템. GUI 에서 손에 든 것으로 정합니다(모델 번호·커스텀아이템 그대로)
# scope  server(이 서버에서만) / network(여러 서버가 같은 잔고 — config.yml 의 network DB)
# default  기본 화폐 — 금액만 적힌 보상·가격과 Vault 가 씁니다. 하나만
# start  처음 받는 금액   max  최대 금액(0 이면 없음)
# transferable  /돈 보내기 허용   ranked  순위에 보임   cheque  수표 허용

# 서버별 기본 돈. 몬스터·랜덤박스·낚시 보상, 상점(Vault) 전부 이것.
money:
  name: '<gold>돈</gold>'
  unit: 원
  icon: GOLD_INGOT
  kind: virtual
  scope: server
  default: true
  transferable: true
  ranked: true
  cheque: true

# 캐시 — 여러 서버가 같은 잔고(통합). 주고받을 수 없다.
cash:
  name: '<aqua>캐시</aqua>'
  unit: 캐시
  icon: DIAMOND
  kind: virtual
  scope: network
  transferable: false
  ranked: false
  cheque: false

# 실물 — 가방에 든 에메랄드 개수가 곧 잔고. 손에 든 것으로 바꾸면 모델 번호 붙은 에메랄드·커스텀아이템도 됩니다.
emerald:
  name: '<green>에메랄드</green>'
  unit: 개
  icon: EMERALD
  kind: item
  mode: inventory
  item:
    item: minecraft:emerald
    mode: REFERENCE
    material: minecraft:emerald
  scope: server
  transferable: false
  ranked: false
  cheque: false

# 실물 은행형 — 잔고는 숫자로 두고 /돈 입금·출금 으로 금덩이 조각과 바꾼다. 통합.
coin:
  name: '<yellow>주화</yellow>'
  unit: 닢
  icon: GOLD_NUGGET
  kind: item
  mode: bank
  item:
    item: minecraft:gold_nugget
    mode: REFERENCE
    material: minecraft:gold_nugget
  scope: network
  transferable: true
  ranked: true
  cheque: false
