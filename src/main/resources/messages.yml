# ============================================================
#  inmc-economy 메시지
# ============================================================
#  MiniMessage 서식. {player} {currency} {amount} {balance} {value} {count}
#  (한글로도: {플레이어} {화폐} {금액} {잔고} {값} {개수})
#  {currency} 는 화폐의 보이는 이름(색 포함)이라, 뒤에 색을 다시 여는 것이 좋습니다.
# ============================================================

prefix: '<gradient:#ffe259:#ffa751>[ 돈 ]</gradient> '
player-only: '<red>플레이어만 쓸 수 있습니다.</red>'
player-not-found: '<red>''{player}'' 을(를) 찾을 수 없습니다. 한 번이라도 접속한 사람만 됩니다.</red>'
unknown-currency: '<red>''{currency}'' 라는 화폐가 없습니다.</red>'
invalid-amount: '<red>금액은 1 이상의 정수로 적어주세요.</red>'
invalid-id: '<red>화폐 id 는 영문 소문자·숫자·밑줄만 됩니다: {value}</red>'
already-exists: '<red>''{value}'' 은(는) 이미 있습니다.</red>'
hand-empty: '<red>손에 아이템을 들고 있어야 합니다.</red>'
no-permission: '<red>권한이 없습니다.</red>'
not-enough: '<red>{currency}<red> 이(가) 모자랍니다. 필요: <white>{amount}</white></red>'
over-max: '<red>{currency}<red> 의 최대 금액을 넘습니다.</red>'
reloaded: '<green>설정을 다시 불러왔습니다. 화폐 {count}개.</green>'
balance-header: '<gold>{player} 의 잔고</gold>'
balance-line: '<gray> - {currency}<gray>: <white>{amount}</white></gray>'
rank-header: '<gold>{currency} <gold>순위</gold>'
rank-line: '<gray> {count}위 <white>{player}</white> - {amount}</gray>'
pay-not-allowed: '<red>{currency}<red> 은(는) 보낼 수 없는 화폐입니다.</red>'
pay-self: '<red>자신에게는 보낼 수 없습니다.</red>'
pay-over-max: '<red>{player} 의 {currency}<red> 이(가) 최대 금액을 넘어 보낼 수 없습니다.</red>'
paid: '<green>{player} 에게 {currency}<green> <white>{amount}</white> 을(를) 보냈습니다. 남은 잔고 <white>{balance}</white></green>'
received: '<green>{player} 에게서 {currency}<green> <white>{amount}</white> 을(를) 받았습니다. 잔고 <white>{balance}</white></green>'
admin-done: '<green>{player} · {currency}<green> <white>{amount}</white> {value} 완료. 잔고 <white>{balance}</white></green>'
admin-failed: '<red>{player} · {currency}<red> {amount} {value} 실패 — 잔고가 모자라거나 최대 금액을 넘습니다(가방 속 개수형은 접속 중이어야 합니다).</red>'
inventory-no-set: '<red>{currency}<red> 은(는) 가방 속 개수형이라 금액을 정할 수 없습니다. 지급·차감을 쓰세요.</red>'
bank-deposited: '<green>{currency}<green> <white>{amount}</white> 을(를) 입금했습니다. 잔고 <white>{balance}</white></green>'
bank-nothing: '<yellow>입금할 {currency}<yellow> 이(가) 가방에 없거나 최대 금액입니다.</yellow>'
bank-withdrew: '<green>{currency}<green> <white>{amount}</white> 을(를) 꺼냈습니다. 잔고 <white>{balance}</white></green>'
not-bank: '<red>{currency}<red> 은(는) 은행형 실물 화폐가 아닙니다.</red>'
pending-delivered: '<green>접속하지 않은 동안 받은 {currency}<green> <white>{amount}</white> 을(를) 가방에 넣었습니다.</green>'
cheque-not-allowed: '<red>{currency}<red> 은(는) 수표로 꺼낼 수 없는 화폐입니다.</red>'
cheque-issued: '<green>{currency}<green> <white>{amount}</white> 수표를 발행했습니다.</green>'
cheque-failed: '<red>수표를 발행하지 못했습니다. 금액은 돌려드렸습니다.</red>'
cheque-unknown-currency: '<red>이 수표의 화폐({currency})가 더 이상 없습니다.</red>'
cheque-used: '<red>이미 쓴 수표입니다.</red>'
cheque-redeemed: '<green>수표 {currency}<green> <white>{amount}</white> 을(를) 잔고에 넣었습니다.</green>'
